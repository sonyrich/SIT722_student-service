name: 03 - Staging Smoke Test

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging Slot"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Wait for staging slot to warm up
        run: sleep 120

      - name: Curl staging health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.APP_NAME }}-staging.azurewebsites.net/health)
          echo "Staging health status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Smoke test failed - blocking production swap"
            exit 1
          fi

      - name: Notify Discord on failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "Failure"
          title: "Staging smoke test failed - production swap blocked"
          color: 0xff0000
